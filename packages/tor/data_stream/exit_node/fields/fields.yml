- name: tor.exit_node
  type: group
  description: Fields related to Tor exit nodes.
  fields:
    - name: deleted_at
      type: date
      description: >
        The timestamp when the address is (will be) removed from the latest destination index. It is `event.ingested` plus two times `labels.interval`.

- name: labels.interval
  type: keyword
  description: User-configured value for the `Interval` setting. It is used to calculate the expiration time.

format_version: "3.4.2"
name: onion_router
title: Onion Router Egress List
version: 0.1.2
source:
  license: "Elastic-2.0"
description: Ingest onion-router egress IP addresses from the Tor Project bulk exit list with Elastic Agent.
type: integration
categories:
  - security
conditions:
  kibana:
    version: "^8.19.0 || ^9.1.0"
policy_templates:
  - name: onion_router
    title: Onion Router Bulk Egress List
    description: Collect onion-router egress IP addresses from the Tor Project bulk exit list.
    inputs:
      - type: cel
        title: Collect onion-router egress IP addresses
        description: Collect onion-router egress IP addresses from the Tor Project bulk exit list.
        vars:
          - name: enable_request_tracer
            type: bool
            title: Enable request tracing
            default: false
            multi: false
            required: false
            show_user: false
            description: >-
              The request tracer logs requests and responses to the agent's local file-system for debugging configurations. Enabling this request tracing compromises security and should only be used for debugging. Disabling the request tracer will delete any stored traces. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_enable) for details.
icons:
  - src: /img/onion-router-egress.svg
    title: Onion Router Egress
    size: 72x72
    type: image/svg+xml
owner:
  github: elastic/security-service-integrations
  type: elastic

title: Onion Router Egress
type: logs
streams:
  - input: cel
    title: Onion Router Egress
    description: Collect onion-router egress IP addresses from the Tor Project bulk exit list.
    template_path: cel.yml.hbs
    vars:
      - name: url
        type: text
        title: URL
        description: URL of the Tor Project bulk exit list. The endpoint returns a plain text list with one IP address per line.
        multi: false
        required: true
        show_user: false
        default: https://check.torproject.org/torbulkexitlist
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: Duration before declaring that the HTTP client connection has timed out. Valid time units are ns, us, ms, s, m, h.
        multi: false
        required: false
        show_user: false
        default: 30s
      - name: proxy_url
        type: text
        title: Proxy URL
        multi: false
        required: false
        show_user: false
        description: URL to proxy connections in the form of http\[s\]://<user>:<password>@<server name/ip>:<port>
      - name: interval
        type: text
        title: Interval
        multi: false
        required: true
        show_user: true
        default: 10m
        description: Duration between requests to the Tor Project bulk exit list. Supported units for this parameter are h/m/s. Example `10m`. The Tor Project states that the list is updated at most once every 40 minutes. The list is downloaded only if it changed since the last successful request, which is checked with the `If-Modified-Since` header.
      - name: expiration
        type: text
        title: Expiration
        multi: false
        required: true
        show_user: true
        default: 2h
        description: >-
          Grace period after which an address that is no longer in the bulk list
          is removed from the latest index (`logs-onion_router_latest.egress`). Addresses
          still in the list are refreshed on every successful download, so the
          latest index converges to the current list after this window. Choose a
          value slightly longer than the list update cadence (the Tor Project
          updates at most about every 40 minutes). Supported units are d/h/m/s.
          Example `2h`. Data stream retention is separate (`lifecycle.yml`).
      - name: ssl
        type: yaml
        title: SSL Configuration
        multi: false
        required: false
        show_user: false
        description: SSL configuration options. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/configuration-ssl.html#ssl-common-config) for details.
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - onion-router-egress
      - name: preserve_original_event
        required: true
        show_user: true
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        type: bool
        multi: false
        default: false
      - name: processors
        type: yaml
        title: Processors
        multi: false
        required: false
        show_user: false
        description: >
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
